name: ci
on: [pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.13' }
      - run: pip install anthropic boto3 flask pytest 'moto[dynamodb,ssm,s3,sqs]' bandit cfn-lint
      - run: pytest -q
      - run: cfn-lint template.yaml
